name: Cross-platform compatibility

on:
  push:
    branches: [main, "compat/windows*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,dense,evaluation,reporting]"
      - name: Environment diagnostics
        run: python scripts/check_environment.py
      - name: Test retrieval, evaluation, portability and process cleanup
        run: python -m pytest -q --junitxml=artifacts/test-results-native.xml
      - name: Real CLI and browser smoke test
        run: python scripts/smoke_portability.py --output artifacts/platform-smoke.json
      - name: Save platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            artifacts/test-results-native.xml
            artifacts/platform-smoke.json
          if-no-files-found: warn
